<!doctype html>
<html><head><meta charset="utf-8"><title>Laya full: running…</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.all.min.js"></script>
</head><body>
<h1>Laya full-model browser test</h1>
<pre id="out">starting…
</pre>
<script type="module">
const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; console.log(s); };
window.__fullLog = [];
const logBoth = (s) => { window.__fullLog.push(s); log(s); };
try {
  logBoth(`ort.web ${ort.env.versions.web}, gpu: ${navigator.gpu ? 'present' : 'absent'}`);
  const fx = await (await fetch('/js/fixtures/choice-2.json')).json();
  logBoth(`fixture ${fx.name} B=${fx.batch} S=${fx.seq_len} K=${fx.kmax}`);
  const toI64 = (nested) => BigInt64Array.from(nested.flat(Infinity).map(v => BigInt(v)));
  const toB8 = (nested) => Uint8Array.from(nested.flat(Infinity).map(v => v ? 1 : 0));
  const { batch: B, seq_len: S, kmax: K } = fx;
  const feeds = {
    input_ids: new ort.Tensor('int64', toI64(fx.inputs.input_ids), [B, S]),
    attention_mask: new ort.Tensor('int64', toI64(fx.inputs.attention_mask), [B, S]),
    marker_pos: new ort.Tensor('int64', toI64(fx.inputs.marker_pos), [B, K]),
    marker_mask: new ort.Tensor('bool', toB8(fx.inputs.marker_mask), [B, K]),
    qtype: new ort.Tensor('int64', toI64([fx.inputs.qtype]), [B]),
  };
  for (const ep of ['wasm', 'webgpu', 'webgpu-basic']) {
    logBoth(`\n== ${ep}: loading model (1.69GB)…`);
    const t0 = performance.now();
    try {
      const opts = { executionProviders: [ep.startsWith('webgpu') ? 'webgpu' : ep] };
      if (ep === 'webgpu-basic') opts.graphOptimizationLevel = 'basic';
      const sess = await ort.InferenceSession.create('/models/laya-faithful-single.onnx', opts);
      logBoth(`${ep}: loaded in ${((performance.now() - t0) / 1000).toFixed(1)}s`);
      const t1 = performance.now();
      const r = await sess.run(feeds);
      const ms = (performance.now() - t1).toFixed(0);
      const logits = Array.from(r.logits.data);
      const exp = fx.expected_torch_logits.flat(Infinity);
      let m = 0;
      for (let i = 0; i < logits.length; i++) m = Math.max(m, Math.abs(logits[i] - exp[i]));
      logBoth(`${ep}: run ${ms}ms, max|logit| vs torch ${m.toExponential(2)} ${m < 1e-4 ? 'PASS' : 'CHECK'}`);
      await sess.release?.();
    } catch (e) {
      logBoth(`${ep}: FAIL ${String(e && e.message || e).slice(0, 300)}`);
    }
  }
} catch (e) {
  logBoth('FATAL ' + String(e && e.message || e).slice(0, 300));
}
logBoth('\nDONE');
document.title = 'Laya full: DONE';
window.__fullDone = true;
</script>
</body></html>
