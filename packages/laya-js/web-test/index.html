<!doctype html>
<html><head><meta charset="utf-8"><title>ORT Web probe: running…</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.all.min.js"></script>
</head><body>
<h1>ORT Web 1.30.0 probe</h1>
<pre id="out">starting…
</pre>
<script type="module">
const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; console.log(s); };
const results = {};
async function test(name, feeds, providers) {
  try {
    const sess = await ort.InferenceSession.create(`models/${name}.onnx`, { executionProviders: providers });
    const r = await sess.run(feeds);
    const keys = Object.keys(r);
    return `OK ${keys.map(k => `${k}[${r[k].dims}]`).join(' ')}`;
  } catch (e) {
    return `FAIL ${String(e && e.message || e).slice(0, 200)}`;
  }
}
function f32(data, dims) { return new ort.Tensor('float32', Float32Array.from(data), dims); }
function b8(data, dims) { return new ort.Tensor('bool', Uint8Array.from(data), dims); }
const cases = {
  add: { a: f32([1,2,3,4,5,6],[2,3]), b: f32([6,5,4,3,2,1],[2,3]) },
  topk: { x: f32([1,5,3,2,4, 9,7,8,6,0],[2,5]) },
  isnan: { x: f32([1,NaN,3,4,5,6],[2,3]) },
  and: { a: b8([1,0,1,1,0,0],[2,3]), b: b8([1,1,0,0,1,0],[2,3]) },
  max: { a: f32([1,5,3,2,4,0],[2,3]), b: f32([4,2,6,1,3,7],[2,3]) },
};
log(`ort.web ${ort.env.versions.web}, navigator.gpu: ${navigator.gpu ? 'present' : 'absent'}`);
for (const ep of ['wasm', 'webgpu']) {
  log(`\n== ${ep} ==`);
  for (const [name, feeds] of Object.entries(cases)) {
    const r = await test(name, feeds, [ep]);
    log(`${name}: ${r}`);
    results[`${ep}:${name}`] = r;
  }
}
log('\nDONE');
document.title = 'ORT Web probe: DONE';
window.__probeDone = true;
window.__probeResults = results;
</script>
</body></html>
