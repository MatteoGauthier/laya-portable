name: ci
on:
  push:
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/laya-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
        # Install at the repo root so workspaces hoist: typescript/oxlint/oxfmt
        # resolve from root .bin. A subdir install leaves npx with no local tsc,
        # and it fetches the unrelated `tsc` package from the registry instead.
        working-directory: ${{ github.workspace }}
      - run: npm run check:versions
      - run: npm test
      - run: npm run check:bpe
      - run: npm run check:bpe-fuzz
      # ORT checks need models/ (gitignored, 1.6GB) — run only when present
      - run: |
          if [ -f ../models/laya-split-single.onnx ]; then npm run check:split; else echo "skip check:split (no models)"; fi
          if [ -f ../models/laya-faithful.onnx ]; then npm run check:node; else echo "skip check:node (no models)"; fi
      - run: npx tsc --noEmit
      - run: npx oxlint
      - run: npx oxfmt --check .

  playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
        # Same as js job: root install, or npx resolves binaries from the registry.
        working-directory: ${{ github.workspace }}
      - run: npx tsc --noEmit
      - run: npx oxlint
      - run: npx oxfmt --check .
      - run: npm test
      - run: npm run build

  python-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest numpy
      # testpaths lives in pyproject.toml (tools/export/tests); no tests/ dir.
      - run: python -m pytest -q

  python-export:
    # Heavy: needs pinned checkpoint + 1.6GB rebuild. Manual only.
    if: contains(github.event.head_commit.message, '[export]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv --python 3.13
      - run: uv pip install --python .venv/bin/python -r requirements-benchmark.txt
      - run: git clone https://github.com/NandhaKishorM/laya upstream/laya && git -C upstream/laya checkout 6a5819129eb220570792e417e49723d697efd76f
      - run: .venv/bin/python tools/export/check_parity.py
      - run: .venv/bin/python -m pytest -q
